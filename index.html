<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ED Shirt Order</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow column like a hang tag; organizer tally + order list below for editors */
:root{
  --paper:#e7e8eb; --card:#f7f7f8; --ink:#1d2a44; --muted:#5d6678; --line:#c6c9d1;
  --accent:#e0a526; --accent-ink:#1d2a44; --ok:#2f7a4f; --bad:#b23a3a;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#13182a; --card:#1c2236; --ink:#e9ebf1; --muted:#9aa2b6; --line:#323a52;
  --accent:#f0b73a; --accent-ink:#13182a; --ok:#5cc08a; --bad:#ef7b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13182a; --card:#1c2236; --ink:#e9ebf1; --muted:#9aa2b6; --line:#323a52;
  --accent:#f0b73a; --accent-ink:#13182a; --ok:#5cc08a; --bad:#ef7b7b; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:max(40px,env(safe-area-inset-top,0px)) max(64px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:clamp(40px,11vw,64px);line-height:.92;margin:0;letter-spacing:-.01em;text-wrap:balance;text-transform:uppercase}
h1 span{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:0 .12em;transform:rotate(-1.5deg)}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:6px}
label,.legend{font-weight:600;font-size:14px}
input[type=text],input[type=email]{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;width:100%;box-sizing:border-box}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.select{position:relative;flex:1 1 160px;min-width:0}
.select select{appearance:none;-webkit-appearance:none;font:inherit;font-weight:600;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:11px 40px 11px 14px;width:100%;cursor:pointer}
.select::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rm{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:4px}
.add{align-self:flex-start}
.total{font-family:var(--mono);font-size:13px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:6px;width:max-content;background:var(--paper)}
.qty button{font:inherit;font-size:20px;width:44px;height:44px;background:none;border:0;color:var(--ink);cursor:pointer}
.qty output{min-width:36px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0}
.btn{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:16px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line);font-size:14px;padding:10px 14px}
.confirm{border-color:var(--ok)}
.confirm h2{font-family:var(--display);font-size:28px;margin:0;text-transform:uppercase;color:var(--ok)}
.receipt{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.receipt dt{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:3px}
.receipt dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.notice{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
h3{font-family:var(--display);font-size:22px;text-transform:uppercase;margin:0}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.tile{border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column}
.tile b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.tile small{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase}
.tile.zero{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1.5px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-variant-numeric:tabular-nums;text-align:right}
.pill{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--paper);border-radius:4px;padding:2px 6px}
.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--bad);cursor:pointer;padding:0;text-decoration:underline}
.copyout{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:12px;min-height:90px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Emergency Department · West Orange</div>
    <h1>ED team <span>shirt</span> order</h1>
  </header>


  <form id="orderForm" class="card" novalidate>
    <div class="field" id="codeField" hidden>
      <label for="code">Team code</label>
      <input id="code" type="text" autocomplete="off">
      <span class="hint">Ask your ED shirt organizer for the code.</span>
    </div>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" type="text" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <span class="hint">Your order confirmation goes here.</span>
    </div>
    <fieldset>
      <legend class="legend">Size and quantity</legend>
      <div class="lines" id="lines"></div>
      <button type="button" class="btn ghost add" id="addLine">+ Add a shirt</button>
    </fieldset>
    <div class="total" id="totalLine">0 shirts</div>
    <div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"><label for="website">Website</label><input id="website" type="text" tabindex="-1" autocomplete="off"></div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="submit" type="submit">Place order</button>
  </form>

  <section id="confirm" class="card confirm" hidden aria-live="polite">
    <h2>Order placed</h2>
    <p style="margin:0">A confirmation email is on its way to <strong id="cEmail"></strong>.</p>
    <dl class="receipt">
      <dt>Name</dt><dd id="cName"></dd>
      <dt>Shirts</dt><dd id="cSize"></dd>
      <dt>Order #</dt><dd id="cNum" style="font-family:var(--mono)"></dd>
    </dl>
    <div><button class="btn ghost" id="editBtn" type="button">Change my order</button></div>
  </section>

</div>

<script src="config.js"></script>
<script>
const ALL=["XS","S","M","L","XL","2XL"], MAX=25;
const CFG=window.ORDER_CONFIG||{};
const $=id=>document.getElementById(id);
let lines=[{size:"",qty:1}], last=null;
function totalOf(c){return Object.values(c||{}).reduce((a,b)=>a+(+b||0),0)}
function summary(c){return ALL.filter(s=>c&&c[s]>0).map(s=>`${c[s]} × ${s}`).join(", ")}
function toSizes(){const m={};lines.forEach(l=>{if(l.size)m[l.size]=(m[l.size]||0)+l.qty});return m}
function renderLines(){
  $("lines").innerHTML=lines.map((l,i)=>`<div class="line"><div class="select"><select id="size-${i}" data-i="${i}" aria-label="Size, shirt ${i+1}"><option value="">Choose a size</option>${ALL.map(s=>`<option value="${s}"${l.size===s?" selected":""}>${s}</option>`).join("")}</select></div><div class="qty" role="group" aria-label="Quantity, shirt ${i+1}"><button type="button" data-i="${i}" data-d="-1" aria-label="One fewer">−</button><output>${l.qty}</output><button type="button" data-i="${i}" data-d="1" aria-label="One more">+</button></div>${lines.length>1?`<button type="button" class="rm" data-rm="${i}">Remove</button>`:""}</div>`).join("");
  paint();
}
function paint(){const m=toSizes(),t=totalOf(m);$("totalLine").textContent=t?`${t} shirt${t===1?"":"s"}: ${summary(m)}`:"Choose a size to add shirts"}
$("lines").addEventListener("change",e=>{const i=e.target.dataset.i;if(i!=null){lines[i].size=e.target.value;paint()}});
$("lines").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.rm!=null){lines.splice(+b.dataset.rm,1);renderLines();return}
  const i=+b.dataset.i;lines[i].qty=Math.max(1,Math.min(MAX,lines[i].qty+(+b.dataset.d)));renderLines();});
$("addLine").onclick=()=>{lines.push({size:"",qty:1});renderLines();$("size-"+(lines.length-1)).focus()};
if(CFG.teamCodeRequired)$("codeField").hidden=false;
renderLines();

const MSG={bad_code:"That team code isn't right. Check with your organizer.",missing_name:"Add your name so we know whose shirts these are.",bad_email:"Enter an email address like name@example.com.",no_shirts:"Add at least one shirt.",too_fast:"Your order just went through. Wait a few seconds before sending a change.",not_set_up:"The order sheet isn't set up yet. Let the organizer know.",server:"Something went wrong saving your order. Try again in a minute."};

$("editBtn").onclick=()=>{$("confirm").hidden=true;$("orderForm").hidden=false;$("submit").textContent="Update order";$("name").focus()};

$("orderForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("name").value.trim(), email=$("email").value.trim(), code=$("code").value.trim(), err=$("err");
  if(CFG.teamCodeRequired&&!code){err.textContent="Enter the team code.";$("code").focus();return}
  if(!name){err.textContent=MSG.missing_name;$("name").focus();return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=MSG.bad_email;$("email").focus();return}
  if(lines.some(l=>!l.size)){err.textContent="Choose a size for each shirt, or remove the empty row.";return}
  if(!CFG.endpoint){err.textContent=MSG.not_set_up;return}
  err.textContent="";const btn=$("submit");btn.disabled=true;const label=btn.textContent;btn.textContent="Sending…";
  const sizes=toSizes();
  try{
    const r=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name,email,code,sizes,website:$("website").value})});
    const d=await r.json();
    if(!d.ok){err.textContent=MSG[d.error]||MSG.server;return}
    $("cName").textContent=name;$("cEmail").textContent=email;
    $("cSize").textContent=`${totalOf(sizes)} total (${summary(sizes)})`;$("cNum").textContent=d.number;
    $("confirm").querySelector("h2").textContent=d.updated?"Order updated":"Order placed";
    $("orderForm").hidden=true;$("confirm").hidden=false;$("confirm").scrollIntoView({block:"start"});
  }catch(x){err.textContent="Your order didn't send. Check your connection and try again."}
  finally{btn.disabled=false;btn.textContent=label}
});
</script>
</body>
</html>
